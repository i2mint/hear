[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "hear"
version = "0.1.20"
description = "Easy access to audio data"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "audio",
    "sound",
    "wav",
    "waveform",
    "data-access",
    "store",
    "dol",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # `dol` was imported directly by hear.stores / hear.session_block_stores but
    # was never declared -- it only ever arrived transitively through py2store.
    "dol",
    # Still required: LocalBinaryStore, RelativePathFormatStore and
    # match_re_for_fstring have no dol equivalent (see the notes at their
    # import sites).
    "py2store",
    "numpy",
    "pandas",
    "soundfile",
    "sortedcontainers",
    "importlib_resources",
]

[project.urls]
Homepage = "https://github.com/i2mint/hear"
Repository = "https://github.com/i2mint/hear"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "hear",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "docs",
    "docsrc",
    "hear/scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
# The CI test action passes no path to pytest -- it only uses `root-dir` for
# the coverage target. So `testpaths` is what actually decides what runs.
testpaths = [
    "tests",
    "hear",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = "hear"

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "hear/scrap",
]
test_on_windows = true

# No .github/umpyre-config.yml in this repo, so there is nothing for the
# metrics action to read.
[tool.wads.ci.metrics]
enabled = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

# Docs publishing stays off: the most recent commit on master before this
# change was "removed isee generate-documentation from CI", so doc generation
# was being taken *out* deliberately. Turning it on here would add an untested
# job to a pipeline that has never run at all.
[tool.wads.ci.docs]
enabled = false

# System dependencies, installed by i2mint/wads/actions/install-system-deps in
# every job that needs them. libsndfile is what `soundfile` binds to; the old
# workflow installed `gcc libsndfile-dev` inline, and this is the declarative
# equivalent (now available to the Windows job too, not just Linux).
[tool.wads.ops.libsndfile]
description = "libsndfile - the native audio I/O library that soundfile binds to"
url = "https://libsndfile.github.io/libsndfile/"

[tool.wads.ops.libsndfile.check]
linux = "ldconfig -p | grep -q libsndfile"
macos = "brew list libsndfile"
windows = "python -c \"import soundfile\""

[tool.wads.ops.libsndfile.install]
linux = [
    "sudo apt-get -qq update",
    "sudo apt-get install -y libsndfile1 libsndfile1-dev",
]
macos = "brew install libsndfile"
windows = "echo soundfile ships a bundled libsndfile in its Windows wheels; no system install needed"

[tool.wads.ops.gcc]
description = "GCC - C toolchain, needed when a dependency has no wheel and builds from source"
url = "https://gcc.gnu.org/"

[tool.wads.ops.gcc.check]
linux = "which gcc"
macos = "which clang"
windows = "where cl || where gcc"

[tool.wads.ops.gcc.install]
linux = [
    "sudo apt-get -qq update",
    "sudo apt-get install -y gcc",
]
macos = "echo clang ships with the macOS runner Command Line Tools; no install needed"
windows = "echo MSVC build tools ship with the Windows runner; no install needed"
